name: TruckLabs
description: >-
  TruckLabs built TruckWings, an automated tractor-mounted aerodynamic device that closes
  the gap between the tractor and trailer to reduce aerodynamic drag, cutting fuel
  consumption by a proven 3-6% and eliminating roughly 7-10 metric tons of CO2 per truck
  each year with an 18-24 month payback. The device deploys automatically at highway speed
  and retracts below it, reduces buffeting and trailer sway in crosswinds, and installs on
  both new builds and retrofits in about two hours. TruckLabs was acquired by ConMet, and
  trucklabs.com now redirects to the ConMet TruckWings product line. As a hardware
  fuel-efficiency company, TruckLabs exposes no public developer API, SDK, or well-known
  discovery surface; this profile captures its identity and probed domain-security posture.
  Backed by Uncork Capital.
